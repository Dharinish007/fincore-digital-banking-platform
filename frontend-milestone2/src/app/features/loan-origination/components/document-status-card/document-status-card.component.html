<div class="document-status-card card">
  <div class="document-header">
    <h4>{{ document.label }}</h4>
    <span class="badge {{ document.status | statusClass }}">{{ document.status }}</span>
  </div>
  <div class="document-actions">
    <button class="secondary-button">Upload</button>
    <button class="ghost-button">View</button>
    <button class="ghost-button">Replace</button>
  </div>
</div>
