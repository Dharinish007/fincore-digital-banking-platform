<div class="filter-bar" [formGroup]="filterForm">
  <mat-form-field appearance="outline" class="filter-search">
    <mat-label>Search customers…</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput formControlName="search" placeholder="Name, ID, or email">
    @if (filterForm.get('search')?.value) {
      <button matSuffix mat-icon-button (click)="filterForm.get('search')?.setValue('')">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option [value]="null">All Statuses</mat-option>
      @for (s of statuses; track s) {
        <mat-option [value]="s">{{ s }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Type</mat-label>
    <mat-select formControlName="customerType">
      <mat-option [value]="null">All Types</mat-option>
      @for (t of customerTypes; track t) {
        <mat-option [value]="t">{{ t }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-select">
    <mat-label>Branch</mat-label>
    <mat-select formControlName="branch">
      <mat-option [value]="null">All Branches</mat-option>
      @for (b of branches; track b) {
        <mat-option [value]="b">{{ b }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button color="warn" (click)="reset()" class="reset-btn">
    <mat-icon>refresh</mat-icon> Reset
  </button>
</div>
