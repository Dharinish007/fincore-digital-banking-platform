<div class="metrics-grid">
  <div class="metric-card">
    <span class="metric-label">Active Loans</span>
    <div class="metric-value">{{ activeLoans }}</div>
    <span class="metric-sub text-blue">Portfolio</span>
  </div>

  <div class="metric-card">
    <span class="metric-label">Disbursed YTD</span>
    <div class="metric-value">{{ disbursedYtd }}</div>
    <span class="metric-sub text-purple">This year</span>
  </div>

  <div class="metric-card">
    <span class="metric-label">NPA Ratio</span>
    <div class="metric-value">{{ npaRatio }}</div>
    <span class="metric-sub text-green">{{ npaTrend }}</span>
  </div>
</div>
