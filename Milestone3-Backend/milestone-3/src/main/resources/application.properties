spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.nosiegnfxvrfwkutgggr
spring.datasource.password=Fincore_Banking
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL initialization configuration
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ==========================================
# Server
# ==========================================

server.port=8080

# ==========================================
# DevTools
# ==========================================

spring.devtools.restart.enabled=true

# ==========================================
# Mail / SMTP Configuration
# ==========================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false