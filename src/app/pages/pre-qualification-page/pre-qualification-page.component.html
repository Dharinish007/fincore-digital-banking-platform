<div class="page-header">
  <div>
    <p class="page-subtitle">Pre-Qualification</p>
    <h2 class="page-title">Evaluate borrower readiness</h2>
  </div>
</div>

<div class="card form-card">
  <div class="form-grid">
    <div class="form-group">
      <label>Customer ID</label>
      <input formControlName="customerId" placeholder="C-XXXXX" />
      <div *ngIf="form.get('customerId')?.invalid && form.get('customerId')?.touched" class="form-error">Required</div>
    </div>
    <div class="form-group">
      <label>Full Name</label>
      <input formControlName="fullName" placeholder="Enter full name" />
      <div *ngIf="form.get('fullName')?.invalid && form.get('fullName')?.touched" class="form-error">Required</div>
    </div>
    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" formControlName="dateOfBirth" />
      <div *ngIf="form.get('dateOfBirth')?.invalid && form.get('dateOfBirth')?.touched" class="form-error">Required</div>
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input formControlName="mobile" placeholder="+91 98765 43210" />
      <div *ngIf="form.get('mobile')?.invalid && form.get('mobile')?.touched" class="form-error">Enter valid mobile</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="example@mail.com" />
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="form-error">Enter valid email</div>
    </div>
    <div class="form-group">
      <label>Employment Type</label>
      <select formControlName="employmentType">
        <option value="">Select</option>
        <option value="Salaried">Salaried</option>
        <option value="Self-Employed">Self-Employed</option>
        <option value="Freelancer">Freelancer</option>
        <option value="Retired">Retired</option>
      </select>
      <div *ngIf="form.get('employmentType')?.invalid && form.get('employmentType')?.touched" class="form-error">Required</div>
    </div>
    <div class="form-group">
      <label>Monthly Income</label>
      <input type="number" formControlName="monthlyIncome" placeholder="Enter monthly income" />
      <div *ngIf="form.get('monthlyIncome')?.invalid && form.get('monthlyIncome')?.touched" class="form-error">Enter a valid income</div>
    </div>
    <div class="form-group">
      <label>Existing Monthly Obligations</label>
      <input type="number" formControlName="existingObligations" placeholder="Enter obligations" />
      <div *ngIf="form.get('existingObligations')?.invalid && form.get('existingObligations')?.touched" class="form-error">Enter a valid amount</div>
    </div>
    <div class="form-group">
      <label>Loan Type</label>
      <select formControlName="loanType">
        <option value="">Select</option>
        <option value="Home Loan">Home Loan</option>
        <option value="Personal Loan">Personal Loan</option>
        <option value="Business Loan">Business Loan</option>
        <option value="Auto Loan">Auto Loan</option>
      </select>
      <div *ngIf="form.get('loanType')?.invalid && form.get('loanType')?.touched" class="form-error">Required</div>
    </div>
    <div class="form-group">
      <label>Requested Loan Amount</label>
      <input type="number" formControlName="requestedLoanAmount" placeholder="Enter loan amount" />
      <div *ngIf="form.get('requestedLoanAmount')?.invalid && form.get('requestedLoanAmount')?.touched" class="form-error">Enter a valid amount</div>
    </div>
    <div class="form-group">
      <label>Preferred Tenure</label>
      <select formControlName="preferredTenure">
        <option value="">Select</option>
        <option value="5 years">5 years</option>
        <option value="10 years">10 years</option>
        <option value="15 years">15 years</option>
        <option value="20 years">20 years</option>
      </select>
      <div *ngIf="form.get('preferredTenure')?.invalid && form.get('preferredTenure')?.touched" class="form-error">Required</div>
    </div>
  </div>

  <div class="form-actions">
    <button class="secondary-button" (click)="checkQualification()">Check Pre-Qualification</button>
    <button class="ghost-button" (click)="reset()">Reset</button>
    <button class="primary-button" (click)="continue()">Continue</button>
  </div>

  <div class="alert" [class.success]="statusType === 'success'" [class.error]="statusType === 'error'" [class.info]="statusType === 'info'">
    {{ statusMessage }}
  </div>
</div>
