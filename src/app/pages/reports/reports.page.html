<div class="glass-card">
  <h2>Reports</h2>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div class="glass-card card-hover" style="width:200px">
      <h4>Daily Report</h4>
    </div>
    <div class="glass-card card-hover" style="width:200px">
      <h4>Weekly Report</h4>
    </div>
    <div class="glass-card card-hover" style="width:200px">
      <h4>Monthly Report</h4>
    </div>
  </div>
  <div style="margin-top:12px">
    <button class="navy-btn" (click)="generate()">Generate Report</button>
    <button class="navy-btn">Download PDF</button>
    <button class="navy-btn">Export Excel</button>
  </div>
</div>
