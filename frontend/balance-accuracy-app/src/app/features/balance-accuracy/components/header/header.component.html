<header class="app-header">
  <div class="header-left">
    <button mat-icon-button (click)="onToggle()" class="sidebar-toggle" title="Toggle Navigation">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand">
      <div class="logo-icon">
        <mat-icon>account_balance</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">FinCore <span class="accent">Nexus</span></span>
        <span class="brand-tag">Core Banking System</span>
      </div>
    </div>
    <div class="header-divider"></div>
    <div class="module-title">
      <mat-icon class="module-icon">{{ moduleIcon }}</mat-icon>
      <span>{{ moduleTitle }}</span>
    </div>
  </div>

  <div class="header-right">
    <!-- Live Status Indicator -->
    <div class="system-status">
      <span class="pulse-dot"></span>
      <span class="status-text">Core Ledger Sync: Active</span>
    </div>

    <!-- Notification Button -->
    <button mat-icon-button class="icon-btn" [matMenuTriggerFor]="notifyMenu" aria-label="Notifications">
      <mat-icon [matBadge]="unreadNotifications" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    </button>

    <mat-menu #notifyMenu="matMenu" class="dark-menu">
      <div class="menu-header">System Notifications</div>
      <button mat-menu-item>
        <mat-icon class="text-error">error_outline</mat-icon>
        <span>14 Balance Mismatches require audit</span>
      </button>
      <button mat-menu-item>
        <mat-icon class="text-success">check_circle_outline</mat-icon>
        <span>Nightly Ledger Batch Completed</span>
      </button>
      <button mat-menu-item>
        <mat-icon class="text-warn">warning_amber</mat-icon>
        <span>High-value Debit Hold placed on ACC-10011886</span>
      </button>
    </mat-menu>

    <!-- User Profile Dropdown -->
    <div class="user-profile" [matMenuTriggerFor]="userMenu">
      <div class="avatar-container">
        <img [src]="currentUser.avatarUrl" [alt]="currentUser.name" class="avatar" />
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">{{ currentUser.role }}</span>
      </div>
      <mat-icon class="chevron">keyboard_arrow_down</mat-icon>
    </div>

    <mat-menu #userMenu="matMenu" class="dark-menu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>My Profile</span>
      </button>
      <button mat-menu-item>
        <mat-icon>security</mat-icon>
        <span>Audit Credentials</span>
      </button>
      <button mat-menu-item class="logout-item">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>
</header>
