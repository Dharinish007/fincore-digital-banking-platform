<!-- If not logged in as Admin, show Admin Login Page -->
<app-admin-login *ngIf="!authService.isLoggedIn()"></app-admin-login>

<!-- Logged In FinCore Banking Console -->
<div 
  *ngIf="authService.isLoggedIn()" 
  class="fincore-app" 
  [class.theme-light]="themeMode() === 'DAY'" 
  [class.theme-dark]="themeMode() === 'NIGHT'"
>
  <!-- Top Header Bar: 3-line Hamburger Drawer Button + FC Logo + Settings Button + Admin Info + Logout -->
  <app-header 
    (toggleDrawer)="toggleDrawer()"
    (openSettings)="setTab('SETTINGS')"
    (logout)="logoutAdmin()"
  ></app-header>

  <!-- Main Layout Shell (Drawer Overlay + 100% Full Width Display Workspace) -->
  <div class="app-body">
    <!-- Overlay Drawer Navigation -->
    <app-sidebar 
      [activeTab]="currentTab()" 
      [isDrawerOpen]="isDrawerOpen()"
      (tabChange)="setTab($event)"
      (closeDrawer)="closeDrawer()"
    ></app-sidebar>

    <!-- Main Workspace Container (Expands Full Width When Drawer Closed) -->
    <main class="main-workspace">
      <div class="workspace-inner">

        <!-- TAB 1: Core Banking Operations Dashboard -->
        <app-dashboard 
          *ngIf="currentTab() === 'DASHBOARD'"
          (goToStatements)="setTab('STATEMENTS')"
          (goToBalance)="setTab('BALANCE')"
          (openEditModalTrigger)="openEditAccountModal()"
          (openTransferModalTrigger)="openTransferModal()"
        ></app-dashboard>

        <!-- TAB 2: Account Lifecycle Module -->
        <app-account-lifecycle 
          *ngIf="currentTab() === 'ACCOUNTS'"
          (openEditModalTrigger)="openEditAccountModal($event)"
        ></app-account-lifecycle>

        <!-- TAB 3: Balance Management Module -->
        <app-balance-management *ngIf="currentTab() === 'BALANCE'"></app-balance-management>

        <!-- TAB 4: Statement Generation Module -->
        <div *ngIf="currentTab() === 'STATEMENTS'" class="statement-tab-wrapper">
          <div class="statement-top-bar">
            <h2>STATEMENTS MANAGEMENT MODULE</h2>
            <button type="button" class="btn-generate-pdf" (click)="openPreviewModal()">
              ⚡ Preview & Export Formal Statement
            </button>
          </div>

          <app-filter-panel></app-filter-panel>
          <app-financial-summary></app-financial-summary>
          <app-transaction-table></app-transaction-table>
          <app-archival-history></app-archival-history>
        </div>

        <!-- TAB 5: System Settings (Normal & Minimized Controls) -->
        <div *ngIf="currentTab() === 'SETTINGS'" class="settings-view">
          <div class="normal-settings-container">
            <h2 class="settings-page-title">Settings</h2>

            <!-- Standard Normal Settings Rows -->
            <div class="normal-setting-row">
              <div class="ns-label">
                <div class="ns-title">Theme Mode</div>
                <div class="ns-sub">Select interface display theme</div>
              </div>
              <!-- Minimized Compact Day / Night Mode Toggle -->
              <div class="compact-theme-toggle">
                <button 
                  type="button" 
                  class="btn-compact-theme" 
                  [class.active]="themeMode() === 'DAY'" 
                  (click)="toggleTheme('DAY')"
                >
                  ☀️ Day
                </button>
                <button 
                  type="button" 
                  class="btn-compact-theme" 
                  [class.active]="themeMode() === 'NIGHT'" 
                  (click)="toggleTheme('NIGHT')"
                >
                  🌙 Night
                </button>
              </div>
            </div>

            <div class="normal-setting-row">
              <div class="ns-label">
                <div class="ns-title">Data Privacy & Masking</div>
                <div class="ns-sub">Obfuscate sensitive account numbers and balances</div>
              </div>
              <button 
                type="button" 
                class="btn-simple-toggle" 
                [class.enabled]="accountService.isDataMasked()"
                (click)="accountService.toggleDataMasking()"
              >
                {{ accountService.isDataMasked() ? 'Masking Enabled' : 'Masking Disabled' }}
              </button>
            </div>

            <div class="normal-setting-row">
              <div class="ns-label">
                <div class="ns-title">Admin Account Session</div>
                <div class="ns-sub" *ngIf="authService.currentAdmin() as admin">
                  Signed in as <strong>{{ admin.name }}</strong> ({{ admin.username }})
                </div>
              </div>
              <button type="button" class="btn-normal-logout" (click)="logoutAdmin()">
                Log Out
              </button>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modals -->
  <app-statement-preview-modal 
    *ngIf="isPreviewModalOpen()" 
    (close)="closePreviewModal()"
    (openEmailModal)="openEmailModal()"
  ></app-statement-preview-modal>

  <app-email-modal 
    *ngIf="isEmailModalOpen()" 
    (close)="closeEmailModal()"
  ></app-email-modal>

  <app-edit-account-modal
    *ngIf="editingAccountId()"
    [accountId]="editingAccountId()!"
    (close)="closeEditAccountModal()"
  ></app-edit-account-modal>

  <app-transfer-modal
    *ngIf="isTransferModalOpen()"
    (close)="closeTransferModal()"
  ></app-transfer-modal>

  <!-- Toast Overlay -->
  <div class="toast-container" *ngIf="deliveryService.toastMessage() as toast">
    <div class="toast-card" [ngClass]="toast.type">
      <div class="toast-title">{{ toast.title }}</div>
      <div class="toast-desc">{{ toast.body }}</div>
    </div>
  </div>
</div>
