spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: milestone-3
              uri: lb://milestone-3
              predicates:
                - Path=/M3/**
              filters:
                - StripPrefix=1

            - id: milestone-2
              uri: lb://milestone-2
              predicates:
                - Path=/M2/**
              filters:
                - StripPrefix=1

            - id: milestone-4
              uri: lb://milestone-4
              predicates:
                - Path=/M4/**
              filters:
                - StripPrefix=1
            - id: milestone-1
              uri: lb://milestone-1
              predicates:
                - Path=/M1/**
              filters:
                - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true