<div class="card panel fade-in" *ngIf="extractedData">
  
  <!-- Header Bar -->
  <div class="result-header">
    <div class="header-left">
      <h3 class="card-title mb-0">
        <mat-icon>subtitles</mat-icon> Extracted Document Information
      </h3>
      <span class="badge" [ngClass]="{
        'badge-approved': extractedData.verificationStatus === 'VERIFIED',
        'badge-review': extractedData.verificationStatus === 'NEEDS_REVIEW',
        'badge-rejected': extractedData.verificationStatus === 'REJECTED'
      }">
        <mat-icon class="badge-icon">check_circle</mat-icon>
        {{ extractedData.verificationStatus }}
      </span>
    </div>

    <div class="header-right">
      <div class="confidence-chip" [ngClass]="getConfidenceColorClass(extractedData.confidenceScore)">
        <mat-icon>psychology</mat-icon>
        <span>Confidence: {{ extractedData.confidenceScore }}%</span>
      </div>

      <button type="button" class="ghost-button btn-sm" (click)="onToggleEdit()">
        <mat-icon>{{ isEditing ? 'done' : 'edit' }}</mat-icon>
        {{ isEditing ? 'Save Edits' : 'Edit Information' }}
      </button>
    </div>
  </div>

  <!-- Form Grid for Extracted Data -->
  <div class="form-grid mt-4">

    <!-- Full Name -->
    <div class="form-group">
      <label>Full Name <span class="req">*</span></label>
      <input 
        type="text" 
        [(ngModel)]="extractedData.fullName" 
        [disabled]="!isEditing"
        placeholder="Extracted full name" />
    </div>

    <!-- Document Number -->
    <div class="form-group">
      <label>Document Number <span class="req">*</span></label>
      <input 
        type="text" 
        [(ngModel)]="extractedData.documentNumber" 
        [disabled]="!isEditing"
        placeholder="Extracted document number" />
    </div>

    <!-- Date of Birth -->
    <div class="form-group">
      <label>Date of Birth</label>
      <input 
        type="text" 
        [(ngModel)]="extractedData.dob" 
        [disabled]="!isEditing"
        placeholder="YYYY-MM-DD" />
    </div>

    <!-- Gender -->
    <div class="form-group">
      <label>Gender</label>
      <select [(ngModel)]="extractedData.gender" [disabled]="!isEditing">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Document Type -->
    <div class="form-group">
      <label>Document Type</label>
      <input 
        type="text" 
        [value]="extractedData.documentType | uppercase" 
        disabled />
    </div>

    <!-- Issue Date -->
    <div class="form-group">
      <label>Issue Date</label>
      <input 
        type="text" 
        [(ngModel)]="extractedData.issueDate" 
        [disabled]="!isEditing"
        placeholder="YYYY-MM-DD" />
    </div>

    <!-- Expiry Date -->
    <div class="form-group">
      <label>Expiry Date</label>
      <input 
        type="text" 
        [(ngModel)]="extractedData.expiryDate" 
        [disabled]="!isEditing"
        placeholder="YYYY-MM-DD or N/A" />
    </div>

    <!-- Full Address -->
    <div class="form-group grid-span-full">
      <label>Extracted Address</label>
      <textarea 
        rows="2" 
        [(ngModel)]="extractedData.address" 
        [disabled]="!isEditing"
        placeholder="Extracted full residential address">
      </textarea>
    </div>

  </div>

  <!-- Action Bar -->
  <div class="form-actions border-top pt-4">
    <button type="button" class="primary-button" (click)="onConfirm()">
      <mat-icon>check_circle_outline</mat-icon> Confirm & Proceed to Liveness Detection
    </button>
    <button type="button" class="secondary-button" (click)="onReprocess()">
      <mat-icon>refresh</mat-icon> Re-extract Document
    </button>
  </div>

</div>
