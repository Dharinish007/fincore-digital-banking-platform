<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinCore Nexus — Bank Teller Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
 
<!-- ============ TOP NAV ============ -->
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24"><path d="M12 2 3 6v6c0 5.2 3.7 9.6 9 11 5.3-1.4 9-5.8 9-11V6l-9-4Z"/><path d="m8.5 12 2.3 2.3L16 9.5" fill="none" stroke="#0B1220" stroke-width="1.6"/></svg>
      FinCore Nexus
    </span>
  </div>
 
  <div class="topbar-center">Milestone 1: Account &amp; Customer Services</div>
 
  <div class="topbar-right">
    <div class="topbar-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="globalSearch" placeholder="Search accounts, customers, logs…" />
    </div>
 
    <div class="dropdown" id="notifDropdown">
      <button class="icon-btn" id="notifBtn" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="badge-dot" id="notifCount">3</span>
      </button>
      <div class="dropdown-menu notif-menu" id="notifMenu">
        <div class="dropdown-header">
          <span>Notifications</span>
          <button class="link-btn" id="clearNotifs">Clear all</button>
        </div>
        <div class="notif-list" id="notifList"></div>
      </div>
    </div>
 
    <div class="dropdown" id="userDropdown">
      <button class="user-chip" id="userBtn">
        <span class="avatar">BT</span>
        <span>Bank Teller</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="dropdown-menu user-menu" id="userMenu">
        <div class="dropdown-header user-menu-header">
          <span class="avatar avatar-lg">BT</span>
          <div>
            <div class="user-name">Priya Raman</div>
            <div class="user-role">Senior Bank Teller · Branch 0417</div>
          </div>
        </div>
        <button class="dropdown-item" data-action="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          My Profile
        </button>
        <button class="dropdown-item" data-action="prefs">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          Preferences
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Logout
        </button>
      </div>
    </div>
  </div>
</header>
 
<div class="app-shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav-menu" id="navMenu">
      <button class="nav-item active" data-section="dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-section="accounts">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        Accounts
      </button>
      <button class="nav-item" data-section="loans">
        <svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Loans
      </button>
      <button class="nav-item" data-section="payments">
        <svg viewBox="0 0 24 24"><path d="M17 3 21 7l-4 4"/><path d="M21 7H9a5 5 0 0 0-5 5"/><path d="M7 21 3 17l4-4"/><path d="M3 17h12a5 5 0 0 0 5-5"/></svg>
        Payments
      </button>
      <button class="nav-item" data-section="kyc">
        <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        KYC
      </button>
      <button class="nav-item" data-section="audit">
        <svg viewBox="0 0 24 24"><path d="M8 2h8l4 4v16H4V2h4Z"/><path d="M16 2v4h4"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h2"/></svg>
        Audit
      </button>
      <button class="nav-item" data-section="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        Settings
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="sys-status">
        <span class="pulse-dot"></span> All systems operational
      </div>
    </div>
  </aside>
 
  <!-- ============ MAIN CONTENT ============ -->
  <main class="main-content" id="mainContent">
    <!-- Sections injected/toggled by script.js -->
  </main>
</div>
 
<!-- ============ MODAL ROOT ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalRoot"></div>
</div>
 
<!-- ============ TOAST ROOT ============ -->
<div class="toast-stack" id="toastStack"></div>
 
<script src="script.js"></script>
</body>
</html>
