<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="selfieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#111C38" />
    </linearGradient>
    <linearGradient id="casualShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <radialGradient id="camLighting" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base (Camera Frame) -->
  <rect width="400" height="480" rx="12" fill="url(#selfieBg)" />
  <rect width="396" height="476" x="2" y="2" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle Camera Viewfinder Grid -->
  <g opacity="0.12" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4 4">
    <line x1="133" y1="20" x2="133" y2="460" />
    <line x1="266" y1="20" x2="266" y2="460" />
    <line x1="20" y1="160" x2="380" y2="160" />
    <line x1="20" y1="320" x2="380" y2="320" />
  </g>

  <!-- Camera Live Stamp -->
  <rect x="20" y="20" width="86" height="24" rx="4" fill="#0C4A6E" stroke="#0284C7" stroke-width="1" />
  <circle cx="32" cy="32" r="4" fill="#38BDF8" />
  <text x="62" y="36" fill="#E0F2FE" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">SELFIE</text>

  <!-- Ambient Camera Light -->
  <circle cx="200" cy="210" r="120" fill="url(#camLighting)" />

  <!-- Avatar / Face Illustration (Slight natural selfie pose angle) -->
  <!-- Shoulders / Casual Dark Tee -->
  <path d="M 90 430 C 90 350, 140 330, 200 330 C 260 330, 310 350, 310 430 Z" fill="url(#casualShirt)" />
  <!-- Crew neck collar -->
  <path d="M 170 330 Q 200 365 230 330" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />

  <!-- Neck -->
  <rect x="180" y="270" width="40" height="65" rx="4" fill="#CBD5E1" opacity="0.8" />

  <!-- Head / Face Contour -->
  <ellipse cx="200" cy="205" rx="72" ry="92" fill="#E2E8F0" opacity="0.95" />
  <ellipse cx="200" cy="205" rx="68" ry="88" fill="#CBD5E1" />
  <ellipse cx="200" cy="200" rx="64" ry="82" fill="#F8FAFC" />

  <!-- Hair Style (Matching ID with natural selfie flow) -->
  <path d="M 128 192 C 128 112, 168 108, 200 108 C 232 108, 272 112, 272 192 C 258 142, 236 132, 200 132 C 164 132, 142 142, 128 192 Z" fill="#0F172A" />

  <!-- Eyebrows -->
  <path d="M 154 174 Q 170 166 186 173" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 214 173 Q 230 166 246 174" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <ellipse cx="170" cy="189" rx="9.5" ry="6.5" fill="#0F172A" />
  <ellipse cx="230" cy="189" rx="9.5" ry="6.5" fill="#0F172A" />
  <circle cx="173" cy="187" r="2.8" fill="#FFFFFF" />
  <circle cx="233" cy="187" r="2.8" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M 200 184 L 196 220 L 206 220" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Natural Smile -->
  <path d="M 180 244 Q 200 255 220 244" stroke="#475569" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Ears -->
  <ellipse cx="130" cy="205" rx="8" ry="18" fill="#CBD5E1" />
  <ellipse cx="270" cy="205" rx="8" ry="18" fill="#CBD5E1" />

  <!-- Biometric Nodes Alignment Mesh -->
  <g opacity="0.7" fill="#60A5FA">
    <circle cx="170" cy="189" r="2.5" />
    <circle cx="230" cy="189" r="2.5" />
    <circle cx="200" cy="184" r="2.5" />
    <circle cx="196" cy="220" r="2.5" />
    <circle cx="180" cy="244" r="2.5" />
    <circle cx="220" cy="244" r="2.5" />
    <circle cx="200" cy="275" r="2.5" />
    <line x1="170" y1="189" x2="230" y2="189" stroke="#60A5FA" stroke-width="0.8" opacity="0.4" />
    <line x1="170" y1="189" x2="196" y2="220" stroke="#60A5FA" stroke-width="0.8" opacity="0.4" />
    <line x1="230" y1="189" x2="196" y2="220" stroke="#60A5FA" stroke-width="0.8" opacity="0.4" />
    <line x1="196" y1="220" x2="200" y2="275" stroke="#60A5FA" stroke-width="0.8" opacity="0.4" />
  </g>

  <!-- Liveness Passive Indicator Stamp -->
  <g transform="translate(305, 20)">
    <circle cx="16" cy="16" r="15" fill="#1E3A8A" opacity="0.9" />
    <text x="16" y="20" fill="#93C5FD" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">LIVE</text>
  </g>
</svg>
