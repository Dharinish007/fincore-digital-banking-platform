spring.application.name=compliance-service
server.port=8092

# Database Configuration (Defaults to embedded H2 for seamless zero-setup execution, supports MySQL via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:compliance_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# External Service URLs (Points to Team A KYC service when deployed)
services.kyc.base-url=${KYC_SERVICE_URL:http://localhost:8080}