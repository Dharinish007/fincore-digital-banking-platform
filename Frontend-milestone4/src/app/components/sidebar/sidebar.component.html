<aside class="fincore-sidebar">
  <nav class="nav-menu">
    <ul>
      @for (item of navItems; track item.route) {
        <li>
          <a 
            [routerLink]="item.route" 
            routerLinkActive="active" 
            class="nav-item"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
