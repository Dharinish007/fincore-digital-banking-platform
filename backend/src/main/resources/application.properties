server.port=8080
spring.application.name=BankingManagement

# H2 In-Memory Database Configuration for instant execution & testing
spring.datasource.url=jdbc:h2:mem:digital_banking;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# PostgreSQL Production Connection (Uncomment when connecting to local PostgreSQL DB)
# spring.datasource.url=jdbc:postgresql://localhost:5432/Banking
# spring.datasource.username=postgres
# spring.datasource.password=root
