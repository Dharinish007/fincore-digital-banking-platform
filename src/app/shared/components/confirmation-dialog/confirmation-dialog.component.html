<h2 mat-dialog-title class="dialog-title">
  @if (data.isDestructive) {
    <mat-icon color="warn" class="icon-warning">warning</mat-icon>
  }
  {{ data.title }}
</h2>
<mat-dialog-content class="mat-typography">
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button mat-flat-button [color]="data.isDestructive ? 'warn' : 'primary'" (click)="onConfirm()" cdkFocusInitial>
    {{ data.confirmText || 'Confirm' }}
  </button>
</mat-dialog-actions>
