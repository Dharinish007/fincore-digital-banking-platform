<!-- Mobile Backdrop Overlay -->
<div class="sidebar-backdrop" *ngIf="isMobileOpen" (click)="onCloseMobile()"></div>

<aside class="fc-sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isMobileOpen">
  <!-- Bank Core Badge in Sidebar Header -->
  <div class="sidebar-brand-strip" *ngIf="!isCollapsed">
    <div class="institution-meta">
      <span class="inst-name">FINCORE NATIONAL BANK</span>
      <span class="inst-sub">CORE BANKING SYSTEM • RBI REGULATED</span>
    </div>
  </div>

  <!-- Navigation Sections Container -->
  <div class="sidebar-scrollable">
    <div class="nav-section" *ngFor="let section of sections">
      <div class="section-title" *ngIf="!isCollapsed">{{ section.title }}</div>

      <ul class="nav-list">
        <li class="nav-item-wrapper" *ngFor="let item of section.items">
          <!-- Standard Single Link -->
          <ng-container *ngIf="!item.children">
            <a
              [routerLink]="item.route"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
              class="nav-link"
              [title]="isCollapsed ? item.label : ''"
              (click)="onCloseMobile()">
              <div class="nav-icon" [ngSwitch]="item.icon">
                <!-- Dashboard -->
                <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <!-- Customers -->
                <svg *ngSwitchCase="'customers'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <!-- Accounts -->
                <svg *ngSwitchCase="'accounts'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                  <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <!-- Transactions -->
                <svg *ngSwitchCase="'transactions'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="17 1 21 5 17 9"></polyline>
                  <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                  <polyline points="7 23 3 19 7 15"></polyline>
                  <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                </svg>
                <!-- Statement -->
                <svg *ngSwitchCase="'statement'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <!-- Loans -->
                <svg *ngSwitchCase="'loans'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <!-- Calculator -->
                <svg *ngSwitchCase="'calculator'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                  <line x1="8" y1="6" x2="16" y2="6"></line>
                  <line x1="8" y1="14" x2="8" y2="14.01"></line>
                  <line x1="12" y1="14" x2="12" y2="14.01"></line>
                  <line x1="16" y1="14" x2="16" y2="14.01"></line>
                  <line x1="8" y1="18" x2="8" y2="18.01"></line>
                  <line x1="12" y1="18" x2="12" y2="18.01"></line>
                  <line x1="16" y1="18" x2="16" y2="18.01"></line>
                </svg>
                <!-- Payments -->
                <svg *ngSwitchCase="'payments'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                  <path d="M12 18V6"></path>
                </svg>
                <!-- Send -->
                <svg *ngSwitchCase="'send'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <!-- Beneficiaries -->
                <svg *ngSwitchCase="'beneficiaries'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="8.5" cy="7" r="4"></circle>
                  <line x1="20" y1="8" x2="20" y2="14"></line>
                  <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                <!-- KYC -->
                <svg *ngSwitchCase="'kyc'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <circle cx="10" cy="13" r="2"></circle>
                  <path d="M14 17a3 3 0 0 0-6 0"></path>
                </svg>
                <!-- Fraud -->
                <svg *ngSwitchCase="'fraud'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <!-- Shield -->
                <svg *ngSwitchCase="'shield'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <!-- Audit -->
                <svg *ngSwitchCase="'audit'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                  <path d="m9 14 2 2 4-4"></path>
                </svg>
                <!-- Notifications -->
                <svg *ngSwitchCase="'notifications'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <!-- Users -->
                <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <!-- Reports -->
                <svg *ngSwitchCase="'reports'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="20" x2="18" y2="10"></line>
                  <line x1="12" y1="20" x2="12" y2="4"></line>
                  <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <!-- Milestones -->
                <svg *ngSwitchCase="'milestones'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 14 14"></polyline>
                </svg>
                <!-- Settings -->
                <svg *ngSwitchCase="'settings'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </div>

              <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>

              <span
                class="nav-badge"
                *ngIf="item.badge && !isCollapsed"
                [ngClass]="item.badgeType || 'info'">
                {{ item.badge }}
              </span>
            </a>
          </ng-container>

          <!-- Parent with Expandable Children (System Architecture) -->
          <ng-container *ngIf="item.children">
            <div
              class="nav-link nav-parent"
              [class.open]="isSubmenuOpen(item.route)"
              (click)="toggleSubmenu(item.route, $event)"
              [title]="isCollapsed ? item.label : ''">
              <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                  <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                  <line x1="6" y1="6" x2="6.01" y2="6"></line>
                  <line x1="6" y1="18" x2="6.01" y2="18"></line>
                </svg>
              </div>
              <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
              <svg
                class="submenu-chevron"
                *ngIf="!isCollapsed"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>

            <!-- Submenu List -->
            <ul class="submenu-list" *ngIf="isSubmenuOpen(item.route) && !isCollapsed">
              <li *ngFor="let child of item.children">
                <a
                  [routerLink]="child.route"
                  routerLinkActive="active"
                  class="submenu-link"
                  (click)="onCloseMobile()">
                  <span class="bullet"></span>
                  <span>{{ child.label }}</span>
                </a>
              </li>
            </ul>
          </ng-container>
        </li>
      </ul>
    </div>
  </div>

  <!-- Sidebar Footer: System Cluster State -->
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="cluster-card">
      <div class="cluster-header">
        <span class="status-indicator"></span>
        <span class="cluster-title">KAFKA / REDIS BUS</span>
      </div>
      <div class="cluster-meta">
        <span>10 Topics • 0 Lag</span>
        <span class="hit-rate">98.4% Hit</span>
      </div>
    </div>
  </div>
</aside>
