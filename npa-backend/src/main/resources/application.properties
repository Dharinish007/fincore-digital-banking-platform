spring.application.name=npa-backend

# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/fincore_npa?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server
# ==========================================

server.port=8081