spring.application.name=face-match-service
server.port=8090

# Database Configuration (In-memory H2 with PostgreSQL compatibility, overrideable via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:facematchdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always