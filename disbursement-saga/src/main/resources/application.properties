spring.application.name=disbursement-saga
server.port=8094

# Database Configuration (Defaults to embedded H2 for seamless zero-setup execution, supports MySQL via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:disbursement_saga_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# External Service URLs (Configured to Team D ports & Team A core banking)
services.kyc.base-url=${KYC_SERVICE_URL:http://localhost:8080}
services.compliance.base-url=${COMPLIANCE_SERVICE_URL:http://localhost:8092}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8093}
services.audit.base-url=${AUDIT_SERVICE_URL:http://localhost:8096}
services.corebanking.base-url=${CORE_BANKING_URL:http://localhost:8080}