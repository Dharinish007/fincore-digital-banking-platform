# ============================================================================
# FinCore Digital Banking Platform - Unified Application Configuration
# Functional Integration: Team B + Team C (Milestones 1, 2, 3, 4)
# ============================================================================

spring.application.name=fincore-backend
server.port=${SERVER_PORT:8080}
spring.main.allow-bean-definition-overriding=true

# ============================================================================
# Database Configuration (Default: MySQL 8.0+)
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digital_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# SQL Initialization
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# ============================================================================
# Mail / SMTP Configuration (Mock / Local fallback)
# ============================================================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ============================================================================
# Milestone 4 - AI Biometric & OCR Microservice Integration
# ============================================================================
ocr.service.url=${OCR_SERVICE_URL:http://localhost:8000}
liveness.service.url=${LIVENESS_SERVICE_URL:http://localhost:8000}
document.upload-dir=uploads/documents

# ============================================================================
# Multipart / File Upload Limits
# ============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================================
# Logging
# ============================================================================
logging.level.com.fincore=INFO
logging.level.com.example.milestone3=INFO
logging.level.org.springframework.web=INFO
