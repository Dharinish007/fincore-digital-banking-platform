<header class="app-topbar">
  <!-- Left: Hamburger + Logo -->
  <div class="topbar-left">
    <button class="topbar-icon-btn hamburger-btn" title="Toggle menu">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">FinCore Nexus</span>
        <span class="brand-sub">CORE BANKING SYSTEM</span>
      </div>
    </div>
  </div>

  <!-- Middle: Breadcrumb -->
  <div class="topbar-center">
    <div class="breadcrumb-divider"></div>
    <div class="breadcrumb-chip">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M9 17l-4-4 4-4M21 13H5m9-9a9 9 0 11-18 0 9 9 0 0118 0z" style="display:none"/>
        <path d="M9 12h.01M15 12h.01M12 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" style="display:none"/>
        <polyline points="9 18 15 12 9 6"/>
      </svg>
      <span>Loan Origination Dashboard</span>
    </div>
  </div>

  <!-- Right: Status + Bell + User -->
  <div class="topbar-right">
    <div class="sync-status">
      <span class="sync-dot"></span>
      Core Ledger Sync: Active
    </div>

    <div class="topbar-icon-btn notif-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span class="notif-badge">3</span>
    </div>

    <div class="user-chip">
      <div class="avatar">AM</div>
      <div class="user-info">
        <span class="user-name">Alex Mercer</span>
        <span class="user-role">Senior Audit Lead</span>
      </div>
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>
</header>
