<div class="dashboard-layout">
  <app-header
    moduleTitle="Account Creation"
    moduleIcon="account_balance_wallet"
    (toggleSidebar)="toggleSidebar()"
  >
  </app-header>

  <div class="main-container">
    <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>

    <main class="content-area">
      <div class="dashboard-header">
        <div class="title-group">
          <h1>Open New Account</h1>
          <p class="subtitle">
            Create a new bank account and register initial ledger balance
          </p>
        </div>
      </div>

      <div class="form-container-card">
        <div class="card-header">
          <div class="header-icon">
            <mat-icon>person_add</mat-icon>
          </div>
          <div>
            <h3>Account Registration Details</h3>
            <p class="muted">Fill in customer information below to create an account.</p>
          </div>
        </div>

        <form (ngSubmit)="submit()" class="account-form">
          <div class="form-grid">
            <div class="form-field">
              <label>Full Name</label>
              <input name="fullname" [(ngModel)]="fullname" placeholder="Enter full name" required />
            </div>

            <div class="form-field">
              <label>Email</label>
              <input name="email" type="email" [(ngModel)]="email" placeholder="Enter email address" />
            </div>

            <div class="form-field">
              <label>Mobile</label>
              <input name="mobile" [(ngModel)]="mobile" placeholder="10-digit mobile number" />
            </div>

            <div class="form-field">
              <label>Branch</label>
              <input name="branch" [(ngModel)]="branch" placeholder="Branch name" />
            </div>

            <div class="form-field">
              <label>IFSC Code</label>
              <input name="ifscCode" [(ngModel)]="ifscCode" placeholder="e.g. FINC0001024" />
            </div>

            <div class="form-field">
              <label>Account Number (optional)</label>
              <input
                name="accountNo"
                [(ngModel)]="accountNo"
                placeholder="Leave blank to auto-generate"
              />
            </div>

            <div class="form-field">
              <label>Account Type</label>
              <select name="accountType" [(ngModel)]="accountType">
                <option value="Savings">Savings</option>
                <option value="Checking">Checking</option>
                <option value="Corporate">Corporate</option>
              </select>
            </div>

            <div class="form-field">
              <label>Initial Deposit</label>
              <input name="initialDeposit" type="number" [(ngModel)]="initialDeposit" placeholder="0.00" />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-submit">
              <mat-icon>add_circle</mat-icon> Create Account
            </button>
          </div>
        </form>

        <div class="status-alert" *ngIf="statusMessage">
          <mat-icon>info</mat-icon>
          <span>{{ statusMessage }}</span>
        </div>
      </div>
    </main>
  </div>
</div>
