<div class="glass-card" *ngIf="tx">
  <h2>Confirm Transaction</h2>
  <div><strong>Sender:</strong> {{tx.sender}}</div>
  <div><strong>Receiver:</strong> {{tx.receiver}}</div>
  <div><strong>Amount:</strong> {{tx.amount | currency}}</div>
  <div><strong>Type:</strong> {{tx.type}}</div>
  <div><strong>Reference:</strong> {{tx.reference}}</div>
  <div><strong>Date:</strong> {{tx.date | date:'medium'}}</div>
  <div *ngIf="tx.description"><strong>Description:</strong> {{tx.description}}</div>

  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="navy-btn primary" (click)="confirm()">Confirm Transaction</button>
    <button class="navy-btn" (click)="edit()">Edit</button>
    <button class="navy-btn" (click)="cancel()">Cancel</button>
  </div>
</div>
