<div class="glass-card">
  <h2>Profile</h2>
  <div><img src="https://via.placeholder.com/80" alt="avatar" style="border-radius:50%"/></div>
  <div><strong>{{profile.name}}</strong></div>
  <div>Customer ID: {{profile.id}}</div>
  <div>Email: {{profile.email}}</div>
  <div>Phone: {{profile.phone}}</div>
  <div>Branch: {{profile.branch}}</div>
  <div style="margin-top:12px">
    <button class="navy-btn" (click)="edit=true">Edit</button>
    <button class="navy-btn" (click)="save()" *ngIf="edit">Save</button>
  </div>
</div>
