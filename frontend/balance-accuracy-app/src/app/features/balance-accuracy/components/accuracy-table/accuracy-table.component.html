<div class="table-container">
  <div class="table-header-banner">
    <div class="banner-title">
      <mat-icon>table_view</mat-icon>
      <span>Live Account Reconciliation Records</span>
      <span class="count-badge">{{ dataSource.data.length }} Accounts</span>
    </div>
    <div class="banner-actions">
      <button
        type="button"
        class="btn-refresh"
        (click)="onRefresh()"
        [disabled]="isRefreshing"
        matTooltip="Refresh Live Records"
      >
        <mat-icon [class.spinning]="isRefreshing">refresh</mat-icon>
        <span>{{ isRefreshing ? 'Refreshing...' : 'Refresh' }}</span>
      </button>
    </div>
  </div>

  <div class="responsive-table-wrapper">
    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="accuracy-mat-table"
    >
      <!-- Account Number Column -->
      <ng-container matColumnDef="accountNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Account Number
        </th>
        <td mat-cell *matCellDef="let element" class="font-mono">
          <div class="acc-cell">
            <span class="acc-num">{{ element.accountNumber }}</span>
            <span
              class="frozen-tag"
              *ngIf="element.isFrozen"
              matTooltip="Account Frozen"
              >❄️ FROZEN</span
            >
          </div>
        </td>
      </ng-container>

      <!-- Customer Name Column -->
      <ng-container matColumnDef="customerName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</th>
        <td mat-cell *matCellDef="let element">
          <div class="customer-cell">
            <span class="cust-name">{{ element.customerName }}</span>
            <span class="cust-id">{{ element.customerId }}</span>
          </div>
        </td>
      </ng-container>

      <!-- Branch Column -->
      <ng-container matColumnDef="branch">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Branch</th>
        <td mat-cell *matCellDef="let element">
          <span class="branch-tag">{{ element.branch }}</span>
        </td>
      </ng-container>

      <!-- Available Balance Column -->
      <ng-container matColumnDef="availableBalance">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Available Balance
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          class="amount-cell text-secondary"
        >
          ₹{{ element.availableBalance | number: "1.2-2" }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="table-row"
      ></tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    aria-label="Select page of bank accounts"
    class="custom-paginator"
  >
  </mat-paginator>
</div>
