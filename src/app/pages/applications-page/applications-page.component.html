<div class="page-header">
  <div>
    <p class="page-subtitle">Applications</p>
    <h2 class="page-title">Manage all loan applications</h2>
  </div>
</div>

<div class="card form-card">
  <div class="form-grid">
    <div class="form-group">
      <label>Search</label>
      <input [(ngModel)]="search" (input)="applyFilters()" placeholder="Search by name or ID" />
    </div>
    <div class="form-group">
      <label>Loan Type</label>
      <select [(ngModel)]="loanType" (change)="applyFilters()">
        <option value="">All</option>
        <option>Home Loan</option>
        <option>Personal Loan</option>
        <option>Business Loan</option>
        <option>Auto Loan</option>
      </select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select [(ngModel)]="status" (change)="applyFilters()">
        <option value="">All</option>
        <option>Draft</option>
        <option>Under Review</option>
        <option>Approved</option>
        <option>Rejected</option>
        <option>Funded</option>
      </select>
    </div>
    <div class="form-group">
      <label>Stage</label>
      <select [(ngModel)]="stage" (change)="applyFilters()">
        <option value="">All</option>
        <option>Pre-Qualification</option>
        <option>Loan Application</option>
        <option>Application Processing</option>
        <option>Underwriting</option>
        <option>Quality Control</option>
        <option>Loan Funding</option>
      </select>
    </div>
    <div class="form-group">
      <label>Sort by</label>
      <select [(ngModel)]="sortField" (change)="applyFilters()">
        <option value="applicationDate">Date</option>
        <option value="requestedAmount">Amount</option>
      </select>
    </div>
    <div class="form-group">
      <label>Direction</label>
      <select [(ngModel)]="sortDirection" (change)="applyFilters()">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
    </div>
  </div>

  <div class="form-actions">
    <button class="ghost-button" (click)="resetFilters()">Clear Filters</button>
  </div>
</div>

<div class="card">
  <div class="table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th>Application ID</th>
          <th>Customer</th>
          <th>Loan Type</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Stage</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let app of filtered">
          <td>{{ app.id }}</td>
          <td>{{ app.fullName }}</td>
          <td>{{ app.loanType }}</td>
          <td>₹{{ app.requestedAmount | number }}</td>
          <td>{{ app.applicationDate }}</td>
          <td>{{ app.stage }}</td>
          <td><span class="badge {{ app.status | statusClass }}">{{ app.status }}</span></td>
          <td class="action-buttons">
            <button class="ghost-button">View</button>
            <button class="secondary-button">Edit</button>
            <button class="primary-button">Continue</button>
            <button class="secondary-button">Delete Draft</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
