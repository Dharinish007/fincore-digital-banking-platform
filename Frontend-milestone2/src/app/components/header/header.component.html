<header class="fincore-header">
  <div class="header-left">
    <div class="brand">
      <span class="brand-title">FinCore Nexus</span>
      <span class="brand-badge">PRO</span>
    </div>
    <div class="header-divider"></div>
    <div class="milestone-tag">{{ currentMilestone }}</div>
  </div>
  
  <div class="header-right">
    <div class="teller-info">
      <span class="teller-icon">👤</span>
      <span class="teller-name">{{ tellerName }}</span>
    </div>
    <span class="logout-separator">|</span>
    <button class="logout-btn" type="button">Logout</button>
  </div>
</header>
